name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned to a concrete image, not `ubuntu-latest`: golden files are
    # platform-sensitive, so they must be generated and verified on one image.
    # `ubuntu-latest` silently migrates to the next LTS and would fail every
    # golden test on a push that changed nothing. Bump this deliberately, and
    # regenerate the goldens in the same change.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format, analyze, test
        run: ./scripts/check.sh

      - name: Upload golden failures
        # Golden diffs are the one failure that is impossible to debug from a
        # log, so keep the images when they happen.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  score:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub.dev score
        # 160 is a perfect score. Anything less is a regression: a missing
        # dartdoc, a stale dependency, a packaging mistake.
        run: ./scripts/score.sh 160

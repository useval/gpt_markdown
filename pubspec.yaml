name: gpt_markdown
description: "Powerful Flutter Markdown & LaTeX Renderer: Rich Text, Math, Tables, Links, and Text Selection. Ideal for ChatGPT, Gemini, and more."
version: 1.3.4
homepage: https://gptmarkdown.com
repository: https://github.com/useval/gpt_markdown
issue_tracker: https://github.com/useval/gpt_markdown/issues

environment:
  # material_ui needs Dart 3.12 and Flutter 3.44.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  val_latex_flutter: ^0.1.2
  val_highlight: ^0.1.0
  val_highlight_flutter: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: lib/fonts/JetBrainsMono-Regular.ttf

topics:
  - markdown
  - latex
  - streaming
  - chatgpt
  - calude

name: gpt_markdown_widgetbook
description: Widgetbook catalogue for gpt_markdown — inspect every component across devices, themes and text scales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  gpt_markdown:
    path: ..
  flutter_math_fork: ^0.7.2
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  widgetbook_generator: ^3.14.0

flutter:
  uses-material-design: true
